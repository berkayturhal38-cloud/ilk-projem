<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hesap Makinası</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator" aria-label="Hesap makinası">
      <section class="display" aria-live="polite">
        <div id="history" class="history" aria-label="İşlem geçmişi"></div>
        <output id="result" class="result" aria-label="Sonuç">0</output>
      </section>

      <section class="keys" aria-label="Hesap makinası tuşları">
        <button type="button" class="key key--utility" data-action="clear">AC</button>
        <button type="button" class="key key--utility" data-action="delete">⌫</button>
        <button type="button" class="key key--utility" data-action="percent">%</button>
        <button type="button" class="key key--operator" data-operator="÷">÷</button>

        <button type="button" class="key" data-number="7">7</button>
        <button type="button" class="key" data-number="8">8</button>
        <button type="button" class="key" data-number="9">9</button>
        <button type="button" class="key key--operator" data-operator="×">×</button>

        <button type="button" class="key" data-number="4">4</button>
        <button type="button" class="key" data-number="5">5</button>
        <button type="button" class="key" data-number="6">6</button>
        <button type="button" class="key key--operator" data-operator="−">−</button>

        <button type="button" class="key" data-number="1">1</button>
        <button type="button" class="key" data-number="2">2</button>
        <button type="button" class="key" data-number="3">3</button>
        <button type="button" class="key key--operator" data-operator="+">+</button>

        <button type="button" class="key key--wide" data-number="0">0</button>
        <button type="button" class="key" data-action="decimal">,</button>
        <button type="button" class="key key--equals" data-action="calculate">=</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
